[project]
name = "mementic"
version = "0.2.5"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "rich>=13.0",
    "tiktoken>=0.5",
    "typer>=0.9",
    "keyring>=25.7.0",
    "json5>=0.9",
    "python-dotenv>=0.21",
]

[project.scripts]
mementic = "mementic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mementic"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.4",
    "types-networkx>=3.6.1.20260518",
]

[tool.pytest.ini_options]
addopts = "-n logical"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
ignore_missing_imports = false
[[tool.mypy.overrides]]
module = ["json5"]
ignore_missing_imports = true
