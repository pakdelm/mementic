[project]
name = "mementic"
version = "0.4.3"
description = "Declarative architectural memory for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "pakdelm", email = "mehrshad.pakdel@posteo.de" },
]
keywords = ["ai", "agents", "architecture", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "rich>=13.0",
    "typer>=0.9",
]

[project.urls]
Homepage = "https://github.com/pakdelm/mementic"
Repository = "https://github.com/pakdelm/mementic"
Issues = "https://github.com/pakdelm/mementic/issues"
Changelog = "https://github.com/pakdelm/mementic/blob/main/CHANGELOG.md"

[project.scripts]
mementic = "mementic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mementic"]

[tool.hatch.build.targets.sdist]
include = [
    "/mementic",
    "/tests",
    "/scripts",
    "/docker/sbx-mementic",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/scripts/demo",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
addopts = "-n logical -m 'not docker'"
markers = [
    "docker: requires a Docker daemon",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
ignore_missing_imports = false
