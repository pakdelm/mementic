name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Docker contract tests
        run: uv run pytest -m docker -n 0

      # The pin is what users build, so build it whenever its tag exists. A
      # release PR bumps the pin before the tag is pushed, so fall back to the
      # latest released tag until then; the recipe check would otherwise 404.
      - name: Resolve the kit version
        id: kit
        run: |
          pin="$(sed -n 's/^ *default: *"\([^"]*\)"/\1/p' docker/sbx-mementic/mementic.yaml)"
          if [ -n "$pin" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/v${pin}" >/dev/null 2>&1; then
            version="$pin"
          else
            version="$(git ls-remote --tags --refs origin 'v*' \
              | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1 || true)"
            if [ -z "$version" ]; then
              echo "Neither the pinned tag v${pin} nor any released v* tag is on origin" >&2
              exit 1
            fi
            echo "::warning::pinned tag v${pin} is not on origin; building v${version}" >&2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the sbx kit artifact
        run: |
          uv run python scripts/build_kit.py --output cacheonly \
            --version "${{ steps.kit.outputs.version }}"
