<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="609" viewBox="0 0 1268 609" role="img" aria-label="Harness transcript: a user names a task, the agent queries mementic, cites the constraint it follows, and records a new decision">
<title>mementic agent demo</title>
<style>
  @keyframes reveal { from { opacity: 0 } to { opacity: 1 } }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  @keyframes ap { from { opacity: 0 } to { opacity: 1 } }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  tspan { animation: ap 0.01s linear both; }
  @media (prefers-reduced-motion: reduce) {
    tspan { animation: none; }
    g { animation: none; }
  }
</style>
<rect width="1268" height="609" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0 10a10 10 0 0 1 10-10h1248a10 10 0 0 1 10 10v24H0z" fill="#161b22"/>
<circle cx="22" cy="17" r="5" fill="#ff5f56"/><circle cx="40" cy="17" r="5" fill="#ffbd2e"/><circle cx="58" cy="17" r="5" fill="#27c93f"/>
<text x="634.0" y="22" text-anchor="middle" font-size="11" fill="#8b949e">mementic in an agent harness</text>
<g style="animation:reveal 0.28s ease-out 0.5s both"><text x="22" y="58" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#7ee787">user   </tspan><tspan fill="#e6edf3">Task: add a refresh-token flow to the auth module</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 0.92s both"><text x="22" y="100" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#ffa657">agent  </tspan><tspan fill="#e6edf3">First I check the project memory for rules on auth and sessions.</tspan></text></g>
<text x="22" y="121" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#79c0ff" style="animation-delay:1.16s">tool   </tspan><tspan fill="#e6edf3" style="animation-delay:1.372s">uv </tspan><tspan fill="#e6edf3" style="animation-delay:1.42s">run </tspan><tspan fill="#e6edf3" style="animation-delay:1.484s">mementic </tspan><tspan fill="#e6edf3" style="animation-delay:1.628s">query </tspan><tspan fill="#e6edf3" style="animation-delay:1.724s">keywords </tspan><tspan fill="#e6edf3" style="animation-delay:1.868s">auth </tspan><tspan fill="#e6edf3" style="animation-delay:1.948s">tokens </tspan><tspan fill="#e6edf3" style="animation-delay:2.06s">session </tspan><tspan fill="#e6edf3" style="animation-delay:2.188s">--compact</tspan></text>
<g style="animation:reveal 0.28s ease-out 2.582s both"><text x="22" y="142" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#79c0ff">[mementic: 1 of 1 constraints, 2 of 3 decisions | auth, tokens, session]</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 2.822s both"><text x="22" y="163" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#d2a8ff">### Constraints (MUST follow)</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 3.062s both"><text x="22" y="184" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#8b949e">- Sessions must stay stateless (#sessions-stay-stateless, bound: src/api/session.py)</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 3.302s both"><text x="22" y="205" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#d2a8ff">### Relevant Decisions</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 3.542s both"><text x="22" y="226" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#8b949e">- Tokens carry the session (#use-jwt-auth, affects: src/api/auth.py)</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 3.962s both"><text x="22" y="268" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#ffa657">agent  </tspan><tspan fill="#e6edf3">There is a constraint: sessions must stay stateless. A refresh-token flow still fits</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 4.142s both"><text x="22" y="289" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="transparent">       </tspan><tspan fill="#e6edf3">if the refresh token rotates and nothing is stored server side.</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 4.322s both"><text x="22" y="310" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="transparent">       </tspan><tspan fill="#e6edf3">Before opening the module, the file gate:</tspan></text></g>
<text x="22" y="331" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#79c0ff" style="animation-delay:4.522s">tool   </tspan><tspan fill="#e6edf3" style="animation-delay:4.734s">uv </tspan><tspan fill="#e6edf3" style="animation-delay:4.782s">run </tspan><tspan fill="#e6edf3" style="animation-delay:4.846s">mementic </tspan><tspan fill="#e6edf3" style="animation-delay:4.99s">query </tspan><tspan fill="#e6edf3" style="animation-delay:5.086s">file </tspan><tspan fill="#e6edf3" style="animation-delay:5.166s">src/api/auth.py </tspan><tspan fill="#e6edf3" style="animation-delay:5.422s">--compact</tspan></text>
<g style="animation:reveal 0.28s ease-out 5.816s both"><text x="22" y="352" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#79c0ff">[mementic: 0 constraints, 1 decisions | src/api/auth.py]</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 6.056s both"><text x="22" y="373" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#8b949e">## Evolution of src/api/auth.py</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 6.296s both"><text x="22" y="394" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#8b949e">- Tokens carry the session (#use-jwt-auth)</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 6.716s both"><text x="22" y="436" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#ffa657">agent  </tspan><tspan fill="#e6edf3">Outcome: I will implement the refresh flow with rotating tokens</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 6.896s both"><text x="22" y="457" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="transparent">       </tspan><tspan fill="#e6edf3">and no server-side session state.</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 7.076s both"><text x="22" y="478" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="transparent">       </tspan><tspan fill="#e6edf3">[mementic: sessions-stay-stateless, use-jwt-auth]</tspan></text></g>
<g style="animation:reveal 0.28s ease-out 7.456s both"><text x="22" y="520" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#ffa657">agent  </tspan><tspan fill="#e6edf3">This decision is new. Recording it so the next session finds it:</tspan></text></g>
<text x="22" y="541" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#79c0ff" style="animation-delay:7.696s">tool   </tspan><tspan fill="#e6edf3" style="animation-delay:7.908s">uv </tspan><tspan fill="#e6edf3" style="animation-delay:7.956s">run </tspan><tspan fill="#e6edf3" style="animation-delay:8.02s">mementic </tspan><tspan fill="#e6edf3" style="animation-delay:8.164s">add </tspan><tspan fill="#e6edf3" style="animation-delay:8.228s">decision </tspan><tspan fill="#e6edf3" style="animation-delay:8.372s">"Refresh </tspan><tspan fill="#e6edf3" style="animation-delay:8.516s">tokens </tspan><tspan fill="#e6edf3" style="animation-delay:8.628s">rotate </tspan><tspan fill="#e6edf3" style="animation-delay:8.74s">on </tspan><tspan fill="#e6edf3" style="animation-delay:8.788s">use" </tspan><tspan fill="#e6edf3" style="animation-delay:8.868s">--rationale </tspan><tspan fill="#e6edf3" style="animation-delay:9.06s">"Rotation </tspan><tspan fill="#e6edf3" style="animation-delay:9.22s">limits </tspan><tspan fill="#e6edf3" style="animation-delay:9.332s">replay </tspan><tspan fill="#e6edf3" style="animation-delay:9.444s">windows </tspan><tspan fill="#e6edf3" style="animation-delay:9.572s">for </tspan><tspan fill="#e6edf3" style="animation-delay:9.636s">stolen </tspan><tspan fill="#e6edf3" style="animation-delay:9.748s">tokens" </tspan><tspan fill="#e6edf3" style="animation-delay:9.876s">--entity </tspan><tspan fill="#e6edf3" style="animation-delay:10.02s">src/api/auth.py</tspan></text>
<g style="animation:reveal 0.28s ease-out 10.51s both"><text x="22" y="562" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan fill="#8b949e">Added decision </tspan><tspan fill="#79c0ff">refresh-tokens-rotate-on-use</tspan></text></g>
<rect x="417.5" y="551" width="7" height="14" fill="#7ee787" style="animation:blink 1s step-end 10.95s infinite"/>
</svg>
